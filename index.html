<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>アドタスカル モック一覧</title>
<style>
  body{ margin:0; background:#f4f6f9; color:#1a202c; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; line-height:1.7; }
  .wrap{ max-width:820px; margin:0 auto; padding:46px 22px 80px; }
  h1{ font-size:24px; margin:0 0 4px; }
  .sub{ color:#718096; font-size:13px; margin-bottom:30px; }
  .tool{ display:block; text-decoration:none; color:inherit; background:#fff; border:1px solid #d8dee6; border-radius:12px; padding:20px 24px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:.12s; }
  .tool:hover{ border-color:#2b6cb0; box-shadow:0 4px 14px rgba(43,108,176,.12); transform:translateY(-1px); }
  .tool h2{ font-size:18px; margin:0 0 4px; color:#234e84; }
  .tool p{ font-size:13.5px; color:#4a5568; margin:6px 0 0; }
  .tool .go{ color:#2b6cb0; font-weight:bold; font-size:13px; margin-top:10px; display:inline-block; }
  .soon{ background:#fafbfd; border-style:dashed; color:#a0aab5; cursor:default; }
  .soon:hover{ border-color:#d8dee6; box-shadow:0 1px 3px rgba(0,0,0,.04); transform:none; }
  .soon h2{ color:#a0aab5; }
  .note{ font-size:11.5px; color:#94a0ae; margin-top:30px; border-top:1px dashed #d8dee6; padding-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>アドタスカル モック一覧</h1>
  <div class="sub">新機能・UI検討用のモック置き場です（操作イメージ確認用 / 実データ更新なし）。</div>

  <a class="tool" href="./program-bulk-editor/">
    <h2>プログラム情報 一括登録・編集 UI</h2>
    <p>1案件に複数のオフラインCVを登録するため、20〜30件をまとめて登録・編集するスプレッドシート型UI。コピペ・オートフィル・一括設定・その場バリデーション・部分反映に対応。バニラ版とRevoGrid版の2案。</p>
    <span class="go">開く →</span>
  </a>

  <div class="tool soon">
    <h2>（別ツールのモック）</h2>
    <p>今後ここに追加予定。</p>
  </div>

  <div class="note">
    ※ いずれも操作イメージ確認用のモックです。ダミーデータ・UIのみで、実データへの保存・機密情報は含みません。
  </div>
</div>
</body>
</html>
